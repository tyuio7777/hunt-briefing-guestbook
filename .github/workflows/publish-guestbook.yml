name: Publish guestbook
on:
  issues:
    types: [opened, edited, closed, reopened, deleted, transferred]
  issue_comment:
    types: [created, edited, deleted]
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/publish-guestbook.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions: {}
concurrency:
  group: guestbook-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'tyuio7777/hunt-briefing-guestbook' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - name: Test publisher
        run: python3 -m unittest discover -s tests -v
      - name: Reconcile changed Issues and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -- data/snapshots data/comments state
            python3 tools/publish_guestbook.py
            python3 tools/check_storage.py
            git add -A -- data state
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'chore: publish validated guestbook snapshot'
            if git push origin HEAD:main; then exit 0; fi
          done
          echo 'Repository changed during publication; run this workflow again.' >&2
          exit 1
